name: Set up Silk
description: Install the Silk release pinned in silk.toml and the Clang 22 it links with.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: build/llvm-22.1.8
        key: llvm-22.1.8-linux-x64-clang
    - shell: bash
      run: |
        echo "SILK_CLANG=$(scripts/install-llvm)" >> "$GITHUB_ENV"
        scripts/install-silk >> "$GITHUB_PATH"
