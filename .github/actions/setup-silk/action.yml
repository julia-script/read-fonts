name: Set up Silk
description: Install the Silk release pinned in silk.toml and point it at Clang 18.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ ! -x /usr/bin/clang-18 ]; then
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-18
        fi
        echo "SILK_CLANG=/usr/bin/clang-18" >> "$GITHUB_ENV"
        scripts/install-silk >> "$GITHUB_PATH"
