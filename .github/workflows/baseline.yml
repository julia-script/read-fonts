# Differential checks against the Rust read-fonts the port started from.
# Too slow for pull requests; run by hand or weekly. The original is a
# baseline, not a parity target: a difference here is a prompt to look,
# not automatically a bug.
name: Baseline comparison
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  READ_FONTS_PROFILE: release

jobs:
  unicode:
    name: Full Unicode property equivalence and sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - run: scripts/check-unicode-equivalence
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path ucd/silk.toml --root src/sweep.silk
      - run: scripts/check-normalization-gap
      - run: scripts/check-unicode-itemization
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unicode-normalization-gap
          path: build/normalization-gap.json

  unicode-performance:
    name: Unicode algorithm performance references
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: |
          cargo fmt --manifest-path scripts/rust-ucd-bench/Cargo.toml --check
          cargo clippy --locked --release --manifest-path scripts/rust-ucd-bench/Cargo.toml --target-dir build/ucd-rust -- -D warnings
          cargo build --locked --release --manifest-path scripts/rust-ucd-bench/Cargo.toml --target-dir build/ucd-rust
          rm -rf build/llvm build/cache
          silk build --release --manifest-path ucd_bench/silk.toml
      - run: scripts/bench-unicode --report build/ucd-bench/time.json
      - if: ${{ !cancelled() }}
        run: scripts/bench-unicode --callgrind --iterations 1 --samples 1 --report build/ucd-bench/instructions.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unicode-performance
          path: build/ucd-bench/

  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-silk
      - name: Build release dumpers
        run: scripts/build --release
      - name: Rust reference dumper
        run: |
          cargo fmt --manifest-path scripts/rust-font-dump/Cargo.toml --check
          cargo clippy --locked --manifest-path scripts/rust-font-dump/Cargo.toml --target-dir build/rust --all-targets -- -D warnings
          cargo test --locked --manifest-path scripts/rust-font-dump/Cargo.toml --target-dir build/rust
      - name: Reference corpus
        run: |
          scripts/font-list --output build/fonts.txt --report build/corpus-inventory.json
          scripts/verify-reference --timeout 600 --report build/reference-report.json
      - name: Corpus dumps
        if: ${{ !cancelled() }}
        run: scripts/compare --timeout 600 --report build/parity-report.json
      - name: Fixtures
        if: ${{ !cancelled() }}
        run: |
          status=0
          scripts/check-core-fixtures || status=1
          for kind in table layout variation aat cff model misc-table; do
            scripts/check-$kind-fixtures --report build/$kind-fixtures-report.json || status=1
          done
          exit $status
      - name: Malformed corpus
        if: ${{ !cancelled() }}
        run: scripts/check-malformed --report build/malformed-report.json.gz
      - name: Speed
        if: ${{ !cancelled() }}
        run: scripts/benchmark --report build/benchmark-report.json
      - name: Library speed
        if: ${{ !cancelled() }}
        run: scripts/bench-library
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-reports
          path: |
            build/*.json
            build/*.json.gz
            build/malformed-failures/
          if-no-files-found: ignore

  shaping:
    name: Shaping differential and performance baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-silk
      - run: silk build --release --manifest-path hr_shape/silk.toml
      - run: cargo build --locked --release --manifest-path scripts/rust-hr-shape/Cargo.toml --target-dir build/harfrust-rust
      - name: Rust shaping harness
        run: |
          cargo fmt --manifest-path scripts/rust-hr-shape/Cargo.toml --check
          cargo clippy --locked --manifest-path scripts/rust-hr-shape/Cargo.toml --target-dir build/harfrust-rust --all-targets -- -D warnings
      - name: Shaping comparisons
        run: scripts/compare-shaping | tee build/shaping-comparison.txt
      - name: Corrupted shaping corpus
        if: ${{ !cancelled() }}
        run: scripts/check-shaping-malformed --all-fonts --mutations-per-font 16 | tee build/shaping-malformed.txt
      - name: Pinned workloads and checksums
        if: ${{ !cancelled() }}
        run: scripts/bench-shaping | tee build/shaping-benchmark.txt
      - name: Upload shaping results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shaping-baseline
          path: |
            build/shaping-*.txt
            build/shaping-malformed-failures/
          if-no-files-found: ignore
