name: Parser parity
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pinned Silk and Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18
          curl -fsSL https://raw.githubusercontent.com/silk-lang/silk/main/install.sh | SILK_RELEASE='v0.1.0-dev.17+1120049495d3' sh
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Check generator and generated output
        run: |
          scripts/generate --check
          cargo fmt --manifest-path tools/font-codegen-silk/Cargo.toml --check
          cargo test --locked --manifest-path tools/font-codegen-silk/Cargo.toml --target-dir build/codegen
          cargo clippy --locked --manifest-path tools/font-codegen-silk/Cargo.toml --target-dir build/codegen --all-targets -- -D warnings
      - name: Build both dumpers
        env:
          SILK_CLANG: /usr/bin/clang-18
        run: scripts/build
      - name: Check reference and harness tests
        run: |
          cargo fmt --manifest-path scripts/rust-font-dump/Cargo.toml --check
          cargo test --locked --manifest-path scripts/rust-font-dump/Cargo.toml --target-dir build/rust
          cargo clippy --locked --manifest-path scripts/rust-font-dump/Cargo.toml --target-dir build/rust --all-targets -- -D warnings
          python3 -m unittest discover -s scripts/tests -v
      - name: Test Silk types, core and table extensions
        env:
          SILK_CLANG: /usr/bin/clang-18
        run: |
          silk test --manifest-path packages/font_types/silk.toml --root src/tests.silk
          silk test --manifest-path packages/read_fonts/silk.toml --root src/tests.silk
      - name: Run the full reference corpus gate
        run: |
          scripts/font-list --output build/fonts.txt --report build/corpus-inventory.json
          scripts/verify-reference --timeout 600 --report build/reference-report.json
      - name: Compare tables and focused edge cases
        run: |
          scripts/compare --timeout 600 --report build/parity-report.json
          scripts/check-core-fixtures
          scripts/check-table-fixtures --report build/table-fixtures-report.json
          scripts/check-layout-fixtures --report build/layout-fixtures-report.json
          scripts/check-variation-fixtures --report build/variation-fixtures-report.json
          scripts/check-aat-fixtures --report build/aat-fixtures-report.json
          scripts/check-cff-fixtures --report build/cff-fixtures-report.json
          scripts/check-model-fixtures --report build/model-fixtures-report.json
          scripts/check-phase2-fixtures --report build/phase2-fixtures-report.json
      - name: Check the CLI and release build
        env:
          SILK_CLANG: /usr/bin/clang-18
        working-directory: packages/font_dump
        run: |
          silk run -- --help
          silk run -- --version
      - name: Build release dumpers
        env:
          SILK_CLANG: /usr/bin/clang-18
        run: scripts/build --release
      - name: Compare release tables and model dumps
        run: scripts/compare --timeout 600 --reference build/rust/release/rust-font-dump --silk-dumper build/llvm/x86_64-unknown-linux-gnu/release/font_dump --report build/release-parity-report.json
      - name: Compare release AAT fixtures
        run: scripts/check-aat-fixtures --reference build/rust/release/rust-font-dump --silk-dumper build/llvm/x86_64-unknown-linux-gnu/release/font_dump --report build/release-aat-fixtures-report.json
      - name: Compare release CFF fixtures
        run: scripts/check-cff-fixtures --reference build/rust/release/rust-font-dump --silk-dumper build/llvm/x86_64-unknown-linux-gnu/release/font_dump --report build/release-cff-fixtures-report.json
      - name: Compare release model fixtures
        run: scripts/check-model-fixtures --reference build/rust/release/rust-font-dump --silk-dumper build/llvm/x86_64-unknown-linux-gnu/release/font_dump --report build/release-model-fixtures-report.json
      - name: Compare release Phase 2 fixtures
        run: scripts/check-phase2-fixtures --reference build/rust/release/rust-font-dump --silk-dumper build/llvm/x86_64-unknown-linux-gnu/release/font_dump --report build/release-phase2-fixtures-report.json
      - name: Measure release dump speed
        run: scripts/benchmark --report build/benchmark-report.json
      - name: Compare deterministic malformed corpus
        run: scripts/check-malformed --reference build/rust/release/rust-font-dump --silk-dumper build/llvm/x86_64-unknown-linux-gnu/release/font_dump --report build/malformed-report.json.gz
      - name: Compress CFF observations
        if: always()
        run: gzip -f build/*cff-fixtures-report.json
      - name: Upload parity observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-9-phase2
          path: |
            build/fonts.txt
            build/corpus-inventory.json
            build/reference-report.json
            build/parity-report.json
            build/release-parity-report.json
            build/table-fixtures-report.json
            build/layout-fixtures-report.json
            build/variation-fixtures-report.json
            build/aat-fixtures-report.json
            build/release-aat-fixtures-report.json
            build/model-fixtures-report.json
            build/release-model-fixtures-report.json
            build/phase2-fixtures-report.json
            build/release-phase2-fixtures-report.json
            build/benchmark-report.json
            build/malformed-report.json.gz
            build/malformed-failures/
            build/cff-fixtures-report.json.gz
            build/release-cff-fixtures-report.json.gz
