# Pull request CI. Budget: 15 minutes wall clock, worst case, cold caches.
# The slow differential checks against Rust read-fonts live in baseline.yml.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  svg:
    name: SVG rendering and conformance tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CPU-only vector dependency
        run: git submodule update --init vendor/silk-gpu
      - uses: actions/cache@v4
        with:
          path: ~/.silk
          key: svg-silk-${{ runner.os }}-${{ hashFiles('svg_core/silk.toml') }}
      - uses: ./.github/actions/setup-silk
      - name: Install native SVG serif font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/svg/requirements.txt
      - run: python3 -m pip install -r scripts/svg/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            svg_core/.cache/specs
            svg_tests/.cache/suites
          key: svg-references-${{ hashFiles('svg_core/specs.lock.json', 'svg_tests/suites.lock.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            svg_css/.cache/encodings
            svg_core/.cache/idna
          key: svg-generated-inputs-${{ hashFiles('svg_css/encodings.lock.json', 'svg_core/idna.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          scripts/svg/generate-encodings --fetch
          scripts/svg/generate-idna --fetch
      - run: scripts/svg/check
      - name: Upload SVG reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-reference-diagnostics
          path: build/svg/
          if-no-files-found: ignore

  tests:
    name: Silk tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk test --manifest-path font_types/silk.toml --root src/tests.silk
      - run: silk test --manifest-path read_fonts/silk.toml --root src/tests.silk

  unicode:
    name: Unicode properties, algorithms and dictionaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path ucd/silk.toml --root src/tests.silk
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path ucd_dictionary/silk.toml --root src/tests.silk
      - run: rm -rf build/llvm build/cache && silk build --release --manifest-path ucd_bench/silk.toml
      - run: build/llvm/x86_64-unknown-linux-gnu/release/ucd_bench --version

  unicode-conformance:
    name: Unicode 18 ${{ matrix.suite }} conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [bidi, line_break, segmentation, normalization]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: scripts/fetch-unicode
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path ucd/silk.toml --root src/${{ matrix.suite }}_conformance.silk

  codegen:
    name: Generated code, formatting and tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-silk
      - uses: actions/cache@v4
        with:
          path: |
            svg_css/.cache/encodings
            svg_core/.cache/idna
          key: svg-generated-inputs-${{ hashFiles('svg_css/encodings.lock.json', 'svg_core/idna.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          scripts/svg/generate-encodings --fetch
          scripts/svg/generate-idna --fetch
      - name: Generated and formatted files are committed
        run: scripts/generate --check
      - name: Codegen tool
        run: |
          cargo fmt --manifest-path tools/font-codegen-silk/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/font-codegen-silk/Cargo.toml --target-dir build/codegen --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/font-codegen-silk/Cargo.toml --target-dir build/codegen
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests

  robustness:
    name: Corpus and corrupted fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - name: Build release font_dump
        working-directory: font_dump
        run: silk build --release
      - name: CLI
        run: |
          build/llvm/x86_64-unknown-linux-gnu/release/font_dump --help
          build/llvm/x86_64-unknown-linux-gnu/release/font_dump --version
      - name: Every corpus font and 4 corrupted variants of each dump cleanly
        env:
          READ_FONTS_PROFILE: release
        run: scripts/check-robustness --mutations-per-font 4
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-failures
          path: build/robustness-failures/
          if-no-files-found: ignore

  shaping:
    name: Native Silk shaping
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - name: Library unit tests
        run: rm -rf build/llvm build/cache && silk test --release --manifest-path harfrust/silk.toml --root src/tests.silk
      - name: Build the shaping runner once
        run: rm -rf build/llvm build/cache && silk build --release --manifest-path hr_shape/silk.toml
      - name: Pinned shaping cases
        run: build/llvm/x86_64-unknown-linux-gnu/release/hr_shape --suite harfrust/tests/shaping.bin
      - name: Long-input regressions
        run: build/llvm/x86_64-unknown-linux-gnu/release/hr_shape --regressions
      - name: Tracing integration
        run: scripts/check-shaping-trace
      - name: Malformed input smoke checks
        run: scripts/check-shaping-malformed
      - name: Upload failing shaping inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shaping-failures
          path: build/shaping-malformed-failures/
          if-no-files-found: ignore

  wasm:
    name: WebAssembly shaping
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hr_wasm/js/package-lock.json
      - name: Install wasm-ld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build hr_wasm for wasm32
        run: scripts/build-wasm
      - name: JS wrapper matches native shaping
        working-directory: hr_wasm/js
        run: |
          npm ci
          npm run typecheck
          npm test
